name: verify-v0.1.7

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: CLI smoke
        run: |
          liber-harvest version
          lh-benchmark --help
          lh-benchmark profile
          lh-benchmark cases
