name: verify-v0.1.7

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Ruff changed files
        run: |
          # B008 is intentionally ignored for Typer's documented Option/Argument default pattern.
          ruff check --ignore B008 \
            src/liber_harvest/__init__.py \
            src/liber_harvest/benchmark_cli.py \
            src/liber_harvest/benchmark_runtime.py \
            src/liber_harvest/constants.py \
            src/liber_harvest/corrections.py \
            src/liber_harvest/pipeline.py \
            src/liber_harvest/providers/lmstudio.py \
            src/liber_harvest/providers/openai.py \
            tests/unit/test_v017_corrections.py
      - name: Compile
        run: python -m compileall -q src
      - name: CLI smoke
        run: |
          liber-harvest version
          lh-benchmark --help
          lh-benchmark profile
          lh-benchmark cases
