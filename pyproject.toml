[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liber-harvest"
version = "0.1.6"
description = "Provenance-preserving historical lore recovery for Liber Vacuitatis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.8,<3",
  "typer>=0.16,<0.17",
  "rich>=13,<14",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "jsonschema>=4.23,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
liber-harvest = "liber_harvest.cli:app"
lh = "liber_harvest.cli:app"
liber-harvest-benchmark = "liber_harvest.benchmark_cli:app"
lh-benchmark = "liber_harvest.benchmark_cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liber_harvest = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
